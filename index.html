    <!-- ── Decorative background blobs (CSS animated, behind everything) ── -->
    <div class="bg-orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- ── Page Wrapper: CSS Grid → header | main | footer ── -->
    <div class="page-wrapper">
      <!-- ════════════ HEADER ════════════ -->
      <header class="app-header" role="banner">
        <!-- Brand: icon + title + tagline -->
        <div class="brand">
          <div class="brand-icon" role="img" aria-label="Antigravity app icon">
            ⚡
          </div>

          <div>
            <h1 class="brand-title">TODO-APP</h1>
            <p class="brand-sub">Todo · Add Task</p>
          </div>
        </div>
        <!-- /.brand -->

        <!-- Header buttons -->
        <div class="header-actions">
          <!--
          THEME TOGGLE BUTTON PLACEHOLDER
          • Add class="light" to <body> to switch theme.
          • CSS variables in §1.1/§1.2 handle all colour changes.
          • For CSS-only toggle: wrap a hidden <input type="checkbox">
            and use :has(input:checked) on <body>.
        -->
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle colour theme"
            title="Add class='light' to <body> to activate light theme"
          >
            <span class="toggle-icon" aria-hidden="true">🌙</span>
            <span class="toggle-track" aria-hidden="true"></span>
            <span>Theme</span>
          </button>
        </div>
        <!-- /.header-actions -->
      </header>
      <!-- /.app-header -->

      <!-- ════════════ MAIN ════════════ -->
      <main class="app-main" role="main">
        <!-- ── Add New Task Card ── -->
        <section class="input-card" aria-label="Add new task">
          <p class="input-card-label" aria-hidden="true">New Task</p>

          <div
            class="input-row"
            role="group"
            aria-label="Task input and add button"
          >
            <label for="task-input" class="sr-only">Task description</label>
            <form onsubmit="addtodo(event)">
              <input
                id="task-input"
                class="task-input"
                type="text"
                name="task"
                placeholder="What needs to be done today…"
                autocomplete="off"
                spellcheck="true"
                aria-label="Enter task description"
              />

              <button class="btn-add" aria-label="Add task to list">
                <span aria-hidden="true">＋</span>
                <span>Add Task</span>
              </button>
            </form>
          </div>
          <!-- /.input-row -->
        </section>
        <!-- /.input-card -->

        <!-- ── Stats Bar: Total / Pending / Done ── -->
        <div
          class="stats-bar"
          role="status"
          aria-label="Task statistics"
          aria-live="polite"
        >
          <div class="stat-pill">
            <span class="stat-dot stat-dot--total" aria-hidden="true"></span>
            <span><strong class="stat-number">4</strong> Total</span>
          </div>

          <div class="stat-divider" aria-hidden="true"></div>

          <div class="stat-pill">
            <span class="stat-dot stat-dot--pending" aria-hidden="true"></span>
            <span><strong class="stat-number">3</strong> Pending</span>
          </div>

          <div class="stat-divider" aria-hidden="true"></div>

          <div class="stat-pill">
            <span class="stat-dot stat-dot--done" aria-hidden="true"></span>
            <span><strong class="stat-number">1</strong> Done</span>
          </div>
        </div>
        <!-- /.stats-bar -->

        <!-- ── Task List Heading ── -->
        <div class="task-list-heading" aria-hidden="true">
          <span>📋 Your Tasks</span>
          <span class="shimmer-text">4 items</span>
        </div>
